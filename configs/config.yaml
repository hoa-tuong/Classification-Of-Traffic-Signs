# ==========================================
# CẤU HÌNH ĐỒ ÁN PHÂN LOẠI BIỂN BÁO GIAO THÔNG
# ==========================================

project:
  name: "vietnamese_traffic_sign_classification"
  device: "cuda" # Tự động fallback sang cpu nếu không có CUDA
  seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  summary_csv: "data/processed/dataset_summary.csv"
  labels_path: "data/class_labels.csv"
  img_size: [128, 128] # [width, height]
  batch_size: 64
  num_workers: 0     # 0 an toàn nhất trên Windows

model:
  name: "mobilenet_v3" # 'custom_cnn' hoặc 'mobilenet_v3'
  num_classes: 250   # 268 lớp toàn diện (biển quy chuẩn + thực tế + OOD Non-sign)
  dropout_rate: 0.3

training:
  epochs: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: "step"
  step_size: 4
  gamma: 0.5
  early_stopping_patience: 3

paths:
  checkpoint_dir: "checkpoints"
  best_model_path: "checkpoints/best_model.pth"
  outputs_figure_dir: "outputs/figures"
  outputs_log_dir: "outputs/logs"
  classification_report_path: "outputs/classification_report.txt"
